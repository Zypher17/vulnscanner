id: insecure-random-usage
name: Potential Insecure Randomness
severity: MEDIUM
description: Application appears to use weak randomness for security tokens.
remediation: Use the 'secrets' module for security-sensitive tokens.
request:
  method: GET
  path: /
  matchers:
    - type: word
      words: ["random.getrandbits", "random.choice"]
---
id: verbose-error-disclosure
name: Verbose Error Disclosure
severity: MEDIUM
description: Application exposes full stack traces in response.
remediation: Implement generic error handling and log traces server-side.
request:
  method: GET
  path: /?name=';
  matchers:
    - type: word
      words: ["Traceback", "line", "File", "SyntaxError"]
---
id: insecure-sqli-pattern
name: Potential SQL Injection Pattern
severity: HIGH
description: SQL syntax characters were reflected in response.
remediation: Use parameterized queries.
request:
  method: GET
  path: /?id=1'
  matchers:
    - type: word
      words: ["syntax error", "Unclosed quotation mark", "SQLSTATE"]
